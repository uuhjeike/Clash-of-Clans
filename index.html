<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clash of Clans — Village Profile</title>
<meta name="description" content="Clash of Clans player profile and post feed.">

<!-- Fonts: a chunky game-style display face for the name/frame, and a clean rounded sans for everything else -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div id="embers"></div>
</div>

<main class="wrap">

  <section class="profile">
    <span class="rivet-bl"></span><span class="rivet-br"></span>
    <div class="avatar-frame">
      <div class="avatar-inner">
        <div class="ph-shimmer"></div>
        <img id="avatarImg" alt="Clash of Clans profile picture" loading="eager" fetchpriority="high">
      </div>
    </div>
    <h1 class="player-name">Clash of Clans</h1>
    <span class="player-tag"><span class="dot"></span>Village profile</span>
    <p class="player-bio">Builder of villages, keeper of the war log. Posts from the base below.</p>
  </section>

  <div class="feed-heading">Recent activity</div>

  <section id="feed" class="feed"></section>

  <p class="feed-end">You've reached the end of the war log.</p>

</main>

<script src="script.js" defer></script>

</body>
</html>
